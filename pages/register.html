<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTER</title>
</head>
<body>
    <h1>
       GAME HUB
    </h1>
    <h2>
        CREATE YOUR GAMEHUB ACCOUNT
    </h2>
    <p>
        Join our gaming community and discover exciting games!
    </p><br><br><br>
    <form>
        <label for="fullname">Full Name</label><br>
        <input type="text" required size="60"><br>
        <label for="username">Username</label><br>
        <input type="text" required size="60"><br><br>
        <label for="gender">Gender</label><br>
        <input type="radio" name="gender" value="male">male
        <input type="radio" name="gender" value="female">female<br><br>
        <label for="email">Email Address</label><br>
        <input type="email" required size="60"><br>
        <label for="phonenumnber">Phone Number</label><br>
        <input type="number" name="phone number" size="60"><br>
        <label for="password">Password</label><br>
        <input type="password" required size="60"><br>
        <label for="confirm password">Confirm Password</label><br>
        <input type="password" required size="60"><br><br>
        <select name="country" required>
            <option value="">Select Country</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="UK">UK</option>
            <option value="Australia">Australia</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
            <option value="India">India</option>
            <option value="Japan">Japan</option>
            <option value="China">China</option>
            <option value="Brazil">Brazil</option>
            <option value="South Africa">South Africa</option>
            <option value="Ethiopia">Ethiopia</option>
            <option value="Russia">Russia</option>
            <option value="Mexico">Mexico</option>
            <option value="Italy">Italy</option>
            <option value="Spain">Spain</option>
            <option value="Netherlands">Netherlands</option>
            <option value="Sweden">Sweden</option>
            <option value="Norway">Norway</option>
            <option value="Switzerland">Switzerland</option>
            <option value="Other">Other</option>
        </select><br><br>
        <label for="interests">Interests</label><br>
        <input type="checkbox" name="interests" value="action">Action
        <input type="checkbox" name="interests" value="sports">Sports
        <input type="checkbox" name="interests" value="racing">Racing
        <input type="checkbox" name="interests" value="adventure">Adventure
        <input type="checkbox" name="interests" value="simulation">Simulation
        <input type="checkbox" name="interests" value="strategy">Strategy<br><br>
        <input type="checkbox" name="terms" required>
        <label for="terms"terms and conditions">I agree to the <a href="terms and conditions.html">Terms and Conditions</a></label><br><br>
        <input type="submit" value="REGISTER"><br>
</body>
</html>
